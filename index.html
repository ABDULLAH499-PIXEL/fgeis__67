<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>STUDENT ATTENDANCE MANAGEMENT SYSTEM</h1>

    <div class="card">
        <h2>ADD STUDENT</h2>
        <div class="form-grid">
            <div>
                <label>STUDENT NAME</label>
                <input id="studentName" type="text" placeholder="Enter student name">
            </div>
            <div>
                <label>ROLL NUMBER</label>
                <input id="rollNumber" type="text" placeholder="Enter roll number">
            </div>
            <div>
                <label>CLASS / GRADE</label>
                <input id="studentClass" type="text" placeholder="Enter class / grade">
            </div>
             <div>
                <label>SECTION</label>
                <input id="studentSection" type="text" placeholder="Enter section">
             </div>
        </div>
        <button id="addStudentBtn" class="add">+ ADD STUDENT</button>
    </div>

    <div class="card">
        <h2>SEARCH STUDENT</h2>
        <input id="searchInput" class="search" type="text" placeholder="🔍 Search by name or roll number...">
    </div> 
 
    <div class="card"> 
        <div class="heading-row">
            <h2>STUDENT LIST</h2>
            <div>
                <label>DATE</label>
                <input id="attendanceDate" type="date">
            </div>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>ROLL NO.</th>
                        <th>CLASS</th>
                        <th>SECTION</th>
                        <th>ATTENDANCE</th>
                        <th>PERCENTAGE</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>
        <p id="emptyMessage" class="empty">No students added yet.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
